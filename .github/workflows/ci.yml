name: ci

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  Run-Tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore termforge.slnx

    - name: Build
      run: |
        dotnet build termforge.slnx --no-restore --configuration Release -p:BuildNumber="$BUILD"
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
        echo "Build $version.$BUILD (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
      env:
        BUILD: ${{ github.run_number }}

    - name: Run Tests
      run: dotnet test termforge.slnx --no-build --configuration Release --logger trx --results-directory TestResults
      env:
        TERMFORGE_SKIP_DOCKER_TESTS: ${{ matrix.os != 'ubuntu-latest' }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: TestResults/

  Frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/Web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npm test

    - name: Build
      run: npm run build
